plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.40'
    id 'net.minecraftforge.renamer' version '1.1.2'
}

version = '1.0.0'
group = 'com.example'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: 'stable', version: '39-1.12'
    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
        }
        register('client')
        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    // Most Forge 1.12.2 libraries are also on Maven Central, which is fast; Forge's own server can stall.
    mavenCentral()
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.12.2-14.23.5.2859')
}

renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = 'srg'
}

tasks.named('assemble') {
    dependsOn tasks.named('renameJar')
}

// Keep the empty resource directory in version control without packaging its placeholder.
tasks.named('processResources') {
    exclude '.gitkeep'
    // Legacy Forge discovers assets relative to the directory containing @Mod classes.
    destinationDir = tasks.named('compileJava', JavaCompile).get().destinationDirectory.get().asFile
    mustRunAfter tasks.named('compileJava')
}

sourceSets.main.output.resourcesDir = tasks.named('compileJava', JavaCompile).get().destinationDirectory.get().asFile

apply from: 'testing/testing.gradle'
